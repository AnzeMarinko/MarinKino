<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Priprava filmov | MarinKino</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/content_editor.css') }}">
</head>
<body>
<a class="skip-link" href="#workspace">Preskoči na vsebino</a>
<header><div><h1>Priprava filmov</h1><p>Preglej izvor, uredi podatke in potrdi pretvorbo.</p></div><nav aria-label="Priprava vsebin"><a href="/">Glasba</a><a href="/videos/editor" aria-current="page">Filmi</a></nav></header>
<main class="preparation-layout">
  <aside class="panel"><h2>Neurejeni filmi</h2><p class="hint">Mape v <code>data/movies/0x-neurejeni-filmi</code>.</p><label for="movie-search">Poišči film</label><input id="movie-search" type="search" placeholder="Ime mape"><div class="controls"><button type="button" id="refresh" class="secondary">Osveži seznam</button></div><div id="movie-list" class="movie-list" aria-live="polite">Nalagam …</div></aside>
  <section id="workspace" aria-label="Koraki priprave"><div class="empty">Izberi film na seznamu. Metapodatke lahko vneseš ročno; pretvorba se začne šele ob potrditvi.</div></section>
</main>
<script nonce="{{ csp_nonce() if csp_nonce is defined else '' }}" src="{{ url_for('static', filename='script/editor-movies.js') }}"></script>
</body>
</html>
