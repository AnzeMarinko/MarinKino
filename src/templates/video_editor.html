<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Priprava filmov | MarinKino</title>
  <style>
    :root{--ink:#172b2d;--muted:#6a7d7d;--line:#d8e5e0;--paper:#eef4f0;--card:#fff;--accent:#d65b36;--accent-dark:#a63d22;--green:#287b68;--shadow:0 18px 50px rgba(23,43,45,.10)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#dbece5 0,transparent 35%),var(--paper);color:var(--ink);font:15px/1.5 Georgia,serif;min-height:100vh}
    header{padding:34px max(24px,5vw) 30px;background:linear-gradient(120deg,#163d3e,#215856);color:#f7f3e8;display:flex;justify-content:space-between;align-items:end;gap:24px}header h1{margin:0;font-size:clamp(28px,4vw,46px);line-height:1.05}header p{margin:9px 0 0;color:#c9ded5}.workspace,main{min-width:0}main{max-width:1320px;margin:30px auto;padding:0 24px;display:grid;grid-template-columns:320px 1fr;gap:24px}.panel,.step-card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.panel{padding:18px}.panel h2{font-size:18px;margin:0 0 14px}.list{display:grid;gap:9px;max-height:calc(100vh - 175px);overflow:auto}.movie{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:13px;cursor:pointer;color:var(--ink);transition:.18s ease}.movie:hover{transform:translateY(-1px);border-color:#e48a6e;box-shadow:0 6px 14px #d65b361a}.movie.active{border-color:var(--accent);background:#fff7f2;box-shadow:inset 3px 0 var(--accent)}.movie strong{display:block;font-size:15px}.movie small{display:block;color:var(--muted);margin-top:3px}.empty{padding:80px 24px;text-align:center;color:var(--muted);border:1px dashed #b7cec4;border-radius:12px;background:#ffffff80}
    .steps{display:flex;gap:7px;margin-bottom:18px;overflow:auto}.step{flex:1;min-width:115px;padding:12px 10px;border-bottom:3px solid var(--line);color:var(--muted);white-space:nowrap}.step.active{border-color:var(--accent);color:var(--ink);font-weight:bold}.step.done{border-color:var(--green);color:var(--green)}.step-card{padding:28px;display:none}.step-card.active{display:block;animation:rise .3s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}h2{margin:0 0 5px;font-size:27px}.hint{color:var(--muted);margin:0 0 22px}.preview{display:grid;grid-template-columns:minmax(260px,.85fr) 1.15fr;gap:20px}.preview video{width:100%;aspect-ratio:16/9;background:#102022;border-radius:8px;box-shadow:0 8px 20px #10202222}.files{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fbfdfc}.files div{padding:9px 0;border-bottom:1px solid var(--line)}.files div:last-child{border:0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:block;height:100%;padding:20px;border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:.18s ease}.choice label:hover{border-color:#e48a6e}.choice input:checked+label{border:2px solid var(--accent);background:#fff7f2}.choice b{display:block;font-size:19px;margin-bottom:5px}.choice span{color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}label{font-weight:bold}input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:11px;font:inherit;color:var(--ink);background:#fcfefd}input[type=text]:focus,textarea:focus{outline:2px solid #e8a18c;border-color:var(--accent)}textarea{min-height:110px;resize:vertical}.subtitles{display:grid;gap:8px;margin:18px 0}.subtitle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:11px;border-radius:7px;background:#fcfefd}.subtitle small{color:var(--muted);margin-left:auto}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:28px}.actions .right{display:flex;gap:10px}button{font:600 15px Georgia,serif;border:0;border-radius:7px;padding:11px 17px;cursor:pointer;transition:.18s ease}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent-dark);transform:translateY(-1px)}.secondary{background:#e2eee9;color:var(--ink)}.secondary:hover{background:#d1e4dd}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:25px;margin-top:14px;color:var(--green)}.error{color:#ad2e25}.download{margin-top:12px}
    @media(max-width:800px){header{display:block;padding:26px 18px}header button{margin-top:18px}main{display:block;margin-top:16px;padding:0 12px}.panel{margin-bottom:16px}.list{max-height:185px;display:flex;overflow:auto}.movie{min-width:205px}.preview,.choices,.form-grid{grid-template-columns:1fr}.step-card{padding:20px}.step{min-width:92px;font-size:13px}.field.wide{grid-column:auto}.actions{align-items:stretch}.actions button{flex:1}}
  </style>
</head>
<body>
  <header><div><h1>Priprava filmov</h1><p>Izberi neurejen film in ga pripravi po korakih.</p></div><button class="secondary" onclick="loadMovies()">Osveži seznam</button></header>
  <main>
    <aside class="panel"><h2>Neurejeni filmi</h2><div id="movie-list" class="list">Nalagam …</div></aside>
    <section class="workspace" id="workspace"><div class="empty">Izberi film na levi za začetek.</div></section>
  </main>
  <script>
    const listEl=document.getElementById('movie-list'), workspace=document.getElementById('workspace'); let movies=[], current=null, step=0, metadata={}, selectedMode='merge', selectedSubtitles=[];
    const labels=['Film','Način','Metapodatki','Podnapisi','Potrditev'];
    const esc=value=>String(value??'').replace(/[&<>"]/g, character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[character]));
    async function api(url, options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await response.json();if(!response.ok||data.status==='error')throw Error(data.message||'Napaka');return data}
    async function loadMovies(){try{const data=await api('/api/movies/incoming');movies=data.movies;listEl.innerHTML=movies.length?movies.map((movie,index)=>`<button class="movie" onclick="selectMovie(${index})"><strong>${esc(movie.name)}</strong><small>${movie.videos.length} video · ${movie.subtitles.length} podnapisov</small></button>`).join(''):'<div class="hint">Ni neurejenih filmov.</div>'}catch(error){listEl.innerHTML=`<div class="error">${esc(error.message)}</div>`}}
    function selectMovie(index){current=movies[index];selectedMode=current.is_collection?'collection':'merge';selectedSubtitles=[...current.subtitles];metadata={title:current.name.replace(/[._-]/g,' '),original_title:'',year:'',plot:'',genres:[],players:'',imdb_id:''};step=0;document.querySelectorAll('.movie').forEach((el,i)=>el.classList.toggle('active',i===index));render()}
    function render(){if(!current)return;workspace.innerHTML=`<div class="steps">${labels.map((label,index)=>`<div class="step ${index===step?'active':''} ${index<step?'done':''}">${index+1}. ${label}</div>`).join('')}</div><div id="card" class="step-card active"></div>`;const card=document.getElementById('card');[filmStep,modeStep,metadataStep,subtitleStep,confirmStep][step](card)}
    function nav(card,next=true){card.insertAdjacentHTML('beforeend',`<div class="actions"><button class="secondary" ${step?'':'disabled'} onclick="step--;render()">Nazaj</button><div class="right"><button class="primary" onclick="${next?'step++;render()':'finish()'}">${next?'Naprej':'Pretvori v HLS'}</button></div></div>`)}
    function filmStep(card){card.innerHTML=`<h2>${esc(current.name)}</h2><p class="hint">Preglej izbrane datoteke pred pripravo.</p><div class="preview"><video controls src="/video/file/${current.folder}/${encodeURIComponent(current.videos[0])}"></video><div class="files">${current.videos.map(file=>`<div>🎞 ${esc(file)}</div>`).join('')}</div></div>`;nav(card)}
    function modeStep(card){const singleVideo=current.videos.length===1;card.innerHTML=`<h2>Kako naj se film obdela?</h2><p class="hint">${singleVideo?'Video bo pretvorjen v HLS.':'Izbira določi, ali bodo videi ostali ločeni ali postali en film.'}</p><div class="choices">${singleVideo?`<div class="choice"><input id="convert" type="radio" name="mode" value="${selectedMode}" checked><label for="convert"><b>Pretvori</b><span>Video bo pripravljen za predvajanje.</span></label></div>`:`<div class="choice"><input id="collection" type="radio" name="mode" value="collection" ${selectedMode==='collection'?'checked':''}><label for="collection"><b>Zbirka</b><span>Vsak video ostane samostojen del.</span></label></div><div class="choice"><input id="merge" type="radio" name="mode" value="merge" ${selectedMode==='merge'?'checked':''}><label for="merge"><b>Združi videe</b><span>Vsi deli postanejo en končni film.</span></label></div>`}</div>`;card.querySelectorAll('input[name=mode]').forEach(input=>input.onchange=()=>selectedMode=input.value);nav(card)}
    async function metadataStep(card){card.innerHTML='<h2>Metapodatki</h2><p class="hint">Pridobi predlog z interneta, nato ga pred potrditvijo uredi.</p><button class="secondary" id="fetch-meta">Pridobi metapodatke</button><div id="meta-form"></div>';document.getElementById('fetch-meta').onclick=async()=>{try{const data=await api('/api/movies/metadata',{method:'POST',body:JSON.stringify({folder:current.folder})});metadata={...metadata,...data.metadata};drawMeta()}catch(error){document.getElementById('meta-form').innerHTML=`<p class="error">${esc(error.message)}</p>`}};drawMeta();nav(card)}
    function drawMeta(){const form=document.getElementById('meta-form');if(!form)return;form.innerHTML=`<div class="form-grid"><div class="field"><label>Naslov</label><input id="title" type="text" value="${esc(metadata.title)}"></div><div class="field"><label>Originalni naslov</label><input id="original_title" type="text" value="${esc(metadata.original_title)}"></div><div class="field"><label>Leto</label><input id="year" type="text" value="${esc(metadata.year)}"></div><div class="field"><label>IMDb ID</label><input id="imdb_id" type="text" value="${esc(metadata.imdb_id)}"></div><div class="field wide"><label>Opis</label><textarea id="plot">${esc(metadata.plot)}</textarea></div><div class="field wide"><label>Igralci</label><input id="players" type="text" value="${esc(Array.isArray(metadata.players)?metadata.players.join('; '):metadata.players)}"></div></div>`}
    async function subtitleStep(card){card.innerHTML=`<h2>Podnapisi</h2><p class="hint">Obdrži želene datoteke, po potrebi jih pridobi ali označi za prevod.</p><button class="secondary download" id="download">Prenesi slovenske in angleške</button> <button class="secondary download" id="translate">Prevedi izbrane v slovenščino</button><div id="subtitle-list" class="subtitles"></div>`;drawSubs();document.getElementById('download').onclick=async()=>{try{await api('/api/movies/subtitles/download',{method:'POST',body:JSON.stringify({folder:current.folder,languages:['sl','en']})});const fresh=await api('/api/movies/incoming');current=fresh.movies.find(movie=>movie.folder===current.folder)||current;selectedSubtitles=[...current.subtitles];drawSubs()}catch(error){document.getElementById('subtitle-list').innerHTML=`<p class="error">${esc(error.message)}</p>`}};document.getElementById('translate').onclick=async()=>{try{selectedSubtitles=[...document.querySelectorAll('[data-sub]:checked')].map(input=>input.dataset.sub);await api('/api/movies/subtitles/translate',{method:'POST',body:JSON.stringify({folder:current.folder,files:selectedSubtitles})});const fresh=await api('/api/movies/incoming');current=fresh.movies.find(movie=>movie.folder===current.folder)||current;selectedSubtitles=[...current.subtitles];drawSubs()}catch(error){document.getElementById('subtitle-list').innerHTML=`<p class="error">${esc(error.message)}</p>`}};nav(card)}
    function drawSubs(){const target=document.getElementById('subtitle-list');if(!target)return;target.innerHTML=current.subtitles.length?current.subtitles.map(file=>`<label class="subtitle"><input type="checkbox" data-sub="${esc(file)}" ${selectedSubtitles.includes(file)?'checked':''}> ${esc(file)} <small>${file.toLowerCase().includes('slo')||file.toLowerCase().includes('.sl.')?'slovenščina':'izvirnik'}</small></label>`).join(''):'<p class="hint">Podnapisov še ni.</p>';target.querySelectorAll('[data-sub]').forEach(input=>input.onchange=()=>{selectedSubtitles=[...target.querySelectorAll('[data-sub]:checked')].map(item=>item.dataset.sub)})}
    function confirmStep(card){const selected=selectedSubtitles;card.innerHTML=`<h2>Potrditev</h2><p class="hint">Preveri nastavitve. Po potrditvi se začne pretvorba, ki lahko traja nekaj časa.</p><div class="files"><div><b>Način:</b> ${selectedMode==='merge'?'združeni videi':'zbirka'}</div><div><b>Naslov:</b> ${esc(metadata.title)}</div><div><b>Podnapisi:</b> ${selected.length||'brez'}</div></div><div id="status" class="status"></div>`;nav(card,false)}
    async function finish(){const status=document.getElementById('status');status.textContent='Pretvarjam …';document.querySelectorAll('.actions button').forEach(button=>button.disabled=true);try{['title','original_title','year','imdb_id','plot','players'].forEach(id=>{const element=document.getElementById(id);if(element)metadata[id]=element.value});const data=await api('/api/movies/process',{method:'POST',body:JSON.stringify({folder:current.folder,mode:selectedMode,metadata,subtitles:selectedSubtitles})});status.textContent=`Končano. Ustvarjen HLS: ${data.hls.join(', ')||'brez datoteke'}`;await loadMovies();setTimeout(()=>{workspace.innerHTML='<div class="empty">Film končan. Izberi naslednji neurejen film.</div>'},900)}catch(error){status.className='status error';status.textContent=error.message;document.querySelectorAll('.actions button').forEach(button=>button.disabled=false)}}
    loadMovies();
  </script>
 </body>
</html>
