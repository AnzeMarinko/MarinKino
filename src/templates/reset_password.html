{% extends "base.html" %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-3 overflow-hidden">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="display-6 fw-bold text-success mb-2">✓</div>
                            <h2 class="h4 text-dark">{% if is_initial_setup %}Nastavite geslo{% else %}Ponastavite geslo{% endif %}</h2>
                            <p class="text-muted small">Ustvarite novo, močno geslo</p>
                        </div>

                        <div class="alert alert-warning alert-dismissible fade show" role="alert">
                            <i class="bi bi-shield-exclamation me-2"></i>
                            <small>Geslo: najmanj 12 znakov, mala in velika črka, številka ter poseben znak.</small>
                        </div>

                        <form method="post" autocomplete="on">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="hidden" name="token" value="{{ token }}">

                            <div class="mb-4">
                                <label for="username" class="form-label fw-semibold">Uporabniško ime</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-light">
                                        <i class="bi bi-person"></i>
                                    </span>
                                    <input id="username" name="username" type="text" class="form-control border-0 bg-light rounded-end" autocomplete="username" value="{{ username or '' }}" {% if is_initial_setup %}readonly{% endif %} placeholder="Vnesite ime" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Novo geslo</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-light">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input id="password" name="password" type="password" class="form-control border-0 bg-light rounded-end" autocomplete="new-password" placeholder="Vsaj 12 znakov" required minlength="12">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password_confirm" class="form-label fw-semibold">Ponovite novo geslo</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-light">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input id="password_confirm" name="password_confirm" type="password" class="form-control border-0 bg-light rounded-end" autocomplete="new-password" placeholder="Ponovite geslo" required minlength="12">
                                </div>
                            </div>

                            <button type="button" id="generate-password" class="btn btn-outline-secondary mb-3">
                                <i class="bi bi-shuffle me-2"></i>Ustvari naključno močno geslo
                            </button>

                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-success btn-lg rounded-2 fw-bold">
                                    <i class="bi bi-check-circle me-2"></i>Potrdi novo geslo
                                </button>
                            </div>
                        </form>

                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-success fw-semibold">
                                ← Nazaj na prijavo
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .input-group-text { color: var(--temno-zelena); }
</style>
<script>
    document.getElementById('generate-password').addEventListener('click', function () {
        const groups = [
            'abcdefghijklmnopqrstuvwxyz',
            'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            '0123456789',
            '!@#$%^&*_-='
        ];
        const alphabet = groups.join('');
        const values = new Uint32Array(16);
        crypto.getRandomValues(values);
        const passwordChars = groups.map((group, index) => (
            group[values[index] % group.length]
        ));
        passwordChars.push(...Array.from(
            values.slice(4),
            value => alphabet[value % alphabet.length]
        ));
        for (let index = passwordChars.length - 1; index > 0; index -= 1) {
            const swapIndex = values[index % values.length] % (index + 1);
            [passwordChars[index], passwordChars[swapIndex]] = [
                passwordChars[swapIndex], passwordChars[index]
            ];
        }
        const password = passwordChars.join('');
        document.getElementById('password').value = password;
        document.getElementById('password_confirm').value = password;
        document.getElementById('password').type = 'text';
        document.getElementById('password_confirm').type = 'text';
    });
</script>
{% endblock %}
