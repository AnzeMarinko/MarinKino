{% if blog_translation_urls and not is_for_mail %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/translation.css') }}">
<div class="dropdown site-translation notranslate order-xl-last" translate="no"
     data-blog-language="{{ blog_language }}"
     data-blog-languages='{{ blog_languages | tojson }}'>
  <button class="btn btn-outline-secondary site-translation__copy" type="button"
          data-copy-url="{{ blog_translation_urls.sl|urlencode }}"
          title="{{ blog_languages.sl.copy_link }}" aria-label="{{ blog_languages.sl.copy_link }}">
    <i class="bi bi-link-45deg" data-copy-icon aria-hidden="true"></i>
  </button>
  <span class="visually-hidden" data-copy-status role="status"></span>
  <button id="blog-language-toggle" class="btn btn-outline-secondary dropdown-toggle site-translation__toggle"
          type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Jezik / Language: Slovenščina">
    <span class="site-translation__flag" data-language-flag aria-hidden="true">{{ blog_languages.sl.flag }}</span>
    <bdi class="site-translation__name" data-language-name lang="sl">{{ blog_languages.sl.name }}</bdi>
    <span class="site-translation__code" data-language-code aria-hidden="true">SL</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end site-translation__options" aria-labelledby="blog-language-toggle">
    {% for code, target in blog_translation_urls.items() %}
    <li>
      <a class="dropdown-item d-flex align-items-center gap-2" href="{{ target }}" data-language="{{ code }}"
         {% if code == 'sl' %}data-original-url="{{ target|urlencode }}"{% endif %}
         target="_blank" rel="noopener noreferrer"
         {% if code != 'sl' %}title="{{ blog_languages[code].notice }}"{% endif %}>
        <span class="site-translation__flag" aria-hidden="true">{{ blog_languages[code].flag }}</span>
        <bdi lang="{{ code }}" dir="{{ blog_languages[code].direction }}">{{ blog_languages[code].name }}</bdi>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
<script defer src="{{ url_for('static', filename='js/blog_translation.js') }}"></script>
{% endif %}
