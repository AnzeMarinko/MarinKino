{% macro button(url, label) -%}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:22px 0;">
  <tr><td align="center" bgcolor="#286e75" style="background:#286e75;border-radius:10px;mso-padding-alt:14px 22px;">
    <a href="{{ url }}" style="display:block;padding:14px 22px;color:#ffffff;font-size:16px;font-weight:bold;line-height:1.5;text-align:center;text-decoration:none;border-radius:10px;">{{ label }}</a>
  </td></tr>
</table>
{%- endmacro %}
{% macro fallback(url, label) -%}
<p style="margin:18px 0;font-size:12px;line-height:1.7;color:#617570;">{{ label }}<br><a href="{{ url }}" dir="ltr" style="display:block;color:#286e75;word-break:break-all;overflow-wrap:anywhere;text-decoration:underline;">{{ url }}</a></p>
{%- endmacro %}
{% macro note() -%}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:18px 0;"><tr><td bgcolor="#f0f6f3" style="padding:16px 18px;background:#f0f6f3;border:1px solid #dce8e1;border-radius:10px;font-size:14px;line-height:1.7;color:#415b55;">{{ caller() }}</td></tr></table>
{%- endmacro %}
