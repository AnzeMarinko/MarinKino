x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: ${MARINKINO_REDIS_IMAGE:-marinkino-redis:current}
    container_name: marinkino-redis
    volumes:
      - redis-data:/data
    command: [redis-server, --dir, /data, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 128mb, --maxmemory-policy, volatile-lru]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *bounded-logs
    restart: unless-stopped

  redis-auth:
    image: ${MARINKINO_REDIS_IMAGE:-marinkino-redis:current}
    container_name: marinkino-redis-auth
    volumes:
      - auth-data:/data
    command: [redis-server, --dir, /data, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 64mb, --maxmemory-policy, noeviction]
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *bounded-logs
    restart: unless-stopped

  app:
    image: ${MARINKINO_APP_IMAGE:-marinkino-app:current}
    build:
      context: .
      args:
        APP_UID: ${MARINKINO_UID:-10001}
        APP_GID: ${MARINKINO_GID:-10001}
        UPDATE_DEPENDENCIES: ${UPDATE_DEPENDENCIES:-0}
        SECURITY_REFRESH: ${SECURITY_REFRESH:-initial}
    container_name: marinkino-app
    environment:
      FLASK_ENV: production
      FLASK_KEY: ${FLASK_KEY:?Run scripts/setup.sh to configure FLASK_KEY}
      MAIN_DOMAIN: ${MAIN_DOMAIN:?MAIN_DOMAIN is required}
      WWW_DOMAIN: ${WWW_DOMAIN:?WWW_DOMAIN is required}
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${WWW_DOMAIN}}
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_TOKEN: ${GMAIL_TOKEN:-}
      MAIL_SENDER: ${MAIL_SENDER:-${GMAIL_USERNAME}}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-${WWW_DOMAIN}}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      FITNESS_DATABASE: /app/data/fitness.sqlite3
      AUTH_REDIS_HOST: redis-auth
      AUTH_REDIS_PORT: "6379"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./data:/app/data
      - ./cache/logs/server:/app/cache/logs/server
      - /var/lib/marinkino-observability:/app/cache/host-status:ro
      - ./cache/downloads:/app/cache/downloads
      - app-socket:/run/marinkino
    depends_on:
      redis-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs: ["/tmp:size=128m,nosuid,nodev,noexec"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${MARINKINO_APP_MEMORY:-1024m}
    pids_limit: 128
    logging: *bounded-logs
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: marinkino-nginx
    ports: ["80:80", "443:443"]
    volumes:
      - ./configuration/nginx/conf:/etc/nginx/conf.d:ro
      - ./configuration/certbot/www:/var/www/certbot:ro
      - ./configuration/certbot/conf:/etc/letsencrypt:ro
      - ./data/music:/music_data:ro
      - ./data/radio-stories:/radio_stories_data:ro
      - ./data/movies:/movies_data:ro
      - ./data/memes:/memes_data:ro
      - ./data/blog_images:/blog_images_data:ro
      - ./cache/downloads:/downloads_data:ro
      - ./cache/logs/nginx:/var/log/nginx
      - app-socket:/run/marinkino:ro
    networks: [edge]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=96m,nosuid,nodev,noexec
      # Alpine's /var/run points to /run. Use the canonical parent so its
      # tmpfs is mounted before the nested app-socket volume, not over it.
      - /run:size=4m,nosuid,nodev,noexec
      - /tmp:size=8m,nosuid,nodev,noexec
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    pids_limit: 64
    logging: *bounded-logs
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: ${MARINKINO_CERTBOT_IMAGE:-marinkino-certbot:current}
    user: "0:0"
    profiles: [maintenance]
    networks: [egress]
    entrypoint: [certbot]
    command: [renew, --non-interactive, --webroot, -w, /var/www/certbot]
    volumes:
      - ./configuration/certbot/www:/var/www/certbot
      - ./configuration/certbot/conf:/etc/letsencrypt
    cap_drop: [ALL]
    # Existing certificate trees may be owned by a previous host/container UID.
    # Certbot must lock/update those files and preserve private-key permissions.
    cap_add: [DAC_OVERRIDE, FOWNER, CHOWN]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    logging: *bounded-logs

networks:
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: mk-backend
  edge:
    driver_opts:
      com.docker.network.bridge.name: mk-edge
  egress:
    driver_opts:
      com.docker.network.bridge.name: mk-egress

volumes:
  app-socket:
  redis-data:
    name: ${MARINKINO_REDIS_VOLUME:-marinkino-redis-data}
  auth-data:
