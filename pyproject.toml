[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marinkino"
version = "1.1.0"
description = "Family entertainment library web app"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "Flask>=3.1.3,<4",
  "Werkzeug>=3.1.9,<4",
  "python-dotenv>=1.2.4,<2",
  "Pillow>=12.3,<13",
  "pillow-heif>=1.8.1,<2",
  "flask-login>=0.6.3,<1",
  "requests>=2.34.2,<3",
  "urllib3>=2.8,<3",
  "beautifulsoup4>=4.15,<5",
  "pandas>=3.0.6,<4",
  "waitress>=3.0.2,<4",
  "flask-compress>=1.25,<2",
  "Flask-WTF>=1.3,<2",
  "Flask-Limiter>=4.1.1,<5",
  "mutagen>=1.48.1,<2",
  "redis>=8.1,<9",
  "markdown>=3.11.1,<4",
  "holidays>=0.106,<1",
  "tqdm>=4.70.1,<5",
  "nh3>=0.3.2,<1",
  "pyotp>=2.9,<3",
]

[project.optional-dependencies]
# Keep the existing lightweight opt-in for local audio analysis.
smart-playlists = ["librosa"]
# Offline preparation runs separately from the public web application.
preparation = [
  "huggingface-hub",
  "cinemagoer",
  "google-cloud",
  "pysrt",
  "scipy",
  "numpy",
  "numba",
  "torch",
  "torchaudio",
  "matplotlib",
  "gemini-srt-translator>=3.8.3",
  "google-cloud-translate",
  "chardet",
  "langdetect",
  "m3u8",
  "playwright",
  "pyautogui",
  "certbot",
  "opensubtitlescom",
  "yt-dlp",
  "librosa",
]
dev = [
  "pre-commit",
  "ruff",
  "isort",
  "basedpyright",
  "pytest>=8,<10",
  "fakeredis[lua]>=2.31,<4",
  "playwright",
]

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["cache", ".venv", "build", "dist", "__pycache__", ".git"]

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["src"]

[tool.ruff.lint]
select = [
    "A",    # warn about shadowing built-ins
    "E",    # style stuff, whitespaces
    "F",    # important pyflakes lints
    "I",    # import sorting
    "N",    # naming
    "T100"
]

[tool.ruff.lint.isort]
known-first-party = ["blueprints", "movies_preparation"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/site-packages",
    "**/node_modules",
    "**/cdk.out",
    "**/.venv",
    "**/.ruff_cache",
    "**/.pytest_cache",
    "**/.gitlab",
    "**/local_testing",
    "**/.vscode",
    "cache",
    ".venv",
    "build",
    "dist",
    "__pycache__"
]
pythonVersion = "3.12"
failOnWarnings = false
include = ["src"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "warning"
reportMissingImports = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"
reportOptionalIterable = "warning"
reportMissingTypeArgument = "warning"
reportOperatorIssue = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportIndexIssue = "warning"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"
reportUnknownParameterType = "warning"
reportUnusedCallResult = false
